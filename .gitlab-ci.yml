image: "node:22"

stages:
  - deploy

deploy:
  stage: deploy
  before_script:
    - apt-get update -y
    - apt-get install -y openssh-client
    - mkdir -p ~/.ssh
    - printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
  script:
    - npm ci
    - npm run build
    - scp -r dist/. "$SERVER_USER@$SERVER_HOST:/var/www/literary-hundred/dist/"
    - ssh "$SERVER_USER@$SERVER_HOST" "nginx -t && systemctl reload nginx"
  only:
    - main
